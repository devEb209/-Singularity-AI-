ect class="b" x="400" y="288" width="300" height="82" rx="12"/><text class="t" x="550" y="320" text-anchor="middle">ARTIFACT GRAPH</text><text class="s" x="550" y="344" text-anchor="middle">files · versions · checksums · provenance</text><rect class="b" x="730" y="288" width="300" height="82" rx="12"/><text class="t" x="880" y="320" text-anchor="middle">VERIFICATION</text><text class="s" x="880" y="344" text-anchor="middle">tests · evidence · health · receipts</text><path class="l" d="M370 329h30M700 329h30"/><text class="s" x="550" y="405" text-anchor="middle">One coherent experience · modular providers · no false operational claims</text></svg>
